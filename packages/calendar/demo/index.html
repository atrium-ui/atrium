<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111214;
      }
      calendar-view {
        height: 100vh;
      }
      .sidebar {
        width: 200px;
        padding: 14px 12px;
        border-right: 1px solid var(--cal-border);
        background: var(--cal-surface);
        color: var(--cal-text);
        font: 13px/1.4 var(--cal-font);
        overflow: auto;
      }
      .sidebar h2 {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--cal-text-faint);
      }
      .calendar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
      }
      .calendar input[type="checkbox"] {
        accent-color: var(--color);
        margin: 0;
      }
      .calendar label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .calendar[data-active] label {
        font-weight: 600;
      }
      .calendar button {
        border: 0;
        background: none;
        color: var(--cal-text-faint);
        cursor: pointer;
        font-size: 12px;
      }
      @media (max-width: 720px) {
        .sidebar {
          display: none;
        }
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <calendar-view storage-key="calendar-demo">
      <nav slot="sidebar" class="sidebar"><h2>Calendars</h2></nav>
    </calendar-view>
  </body>
</html>
