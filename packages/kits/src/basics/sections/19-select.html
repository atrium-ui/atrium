<!-- requires: @atrium-ui/elements/select -->
<!-- Built with Atrium UI — https://atrium-ui.dev/ -->
<!-- Trigger label is kit-owned: sync it from the `change` event
     (`event.detail.selected`). The element does not rewrite the slot. -->
<form class="grid max-w-xl gap-4" onsubmit="return false">
  <label class="block">
    <span class="mb-1 block text-sm font-medium text-stone-700">Plan</span>
    <a-select
      name="plan"
      value="pro"
      class="relative inline-block w-full [&[opened]_.select-chevron]:rotate-180"
      onchange="const l=this.querySelector('[data-kit-select-label]');const o=event.detail.selected;if(l&&o)l.textContent=o.textContent.trim()"
    >
      <button
        slot="trigger"
        type="button"
        aria-haspopup="listbox"
        class="flex w-full cursor-pointer items-center justify-between gap-3 whitespace-nowrap rounded-md border border-stone-300 bg-white px-3 py-2 text-left text-sm text-stone-900 transition-colors hover:border-stone-400 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
      >
        <span data-kit-select-label class="min-w-0 flex-1 truncate">Pro</span>
        <svg
          aria-hidden="true"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          class="select-chevron size-4 flex-none text-stone-500 transition-transform duration-150"
        >
          <path
            d="m5 7.5 5 5 5-5"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div
        class="mt-1 rounded-md border border-stone-200 bg-white p-1 shadow-[0_8px_24px_-4px_rgb(0_0_0/0.12)]"
      >
        <a-option
          value="free"
          class="block cursor-pointer rounded-md px-3 py-2 text-sm text-stone-700 hover:bg-primary-50 [&[selected]]:bg-primary-50 [&[selected]]:font-medium [&[selected]]:text-primary-900"
        >
          Free
        </a-option>
        <a-option
          value="pro"
          class="block cursor-pointer rounded-md px-3 py-2 text-sm text-stone-700 hover:bg-primary-50 [&[selected]]:bg-primary-50 [&[selected]]:font-medium [&[selected]]:text-primary-900"
        >
          Pro
        </a-option>
        <a-option
          value="team"
          class="block cursor-pointer rounded-md px-3 py-2 text-sm text-stone-700 hover:bg-primary-50 [&[selected]]:bg-primary-50 [&[selected]]:font-medium [&[selected]]:text-primary-900"
        >
          Team
        </a-option>
      </div>
    </a-select>
  </label>

  <label class="block">
    <span class="mb-1 block text-sm font-medium text-stone-700">Locale</span>
    <a-select
      name="locale"
      value="en"
      class="relative inline-block w-full [&[opened]_.select-chevron]:rotate-180"
      onchange="const l=this.querySelector('[data-kit-select-label]');const o=event.detail.selected;if(l&&o)l.textContent=o.textContent.trim()"
    >
      <button
        slot="trigger"
        type="button"
        aria-haspopup="listbox"
        class="flex w-full cursor-pointer items-center justify-between gap-3 whitespace-nowrap rounded-md border border-stone-300 bg-white px-3 py-2 text-left text-sm text-stone-900 transition-colors hover:border-stone-400 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
      >
        <span data-kit-select-label class="min-w-0 flex-1 truncate">English</span>
        <svg
          aria-hidden="true"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          class="select-chevron size-4 flex-none text-stone-500 transition-transform duration-150"
        >
          <path
            d="m5 7.5 5 5 5-5"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div
        class="mt-1 rounded-md border border-stone-200 bg-white p-1 shadow-[0_8px_24px_-4px_rgb(0_0_0/0.12)]"
      >
        <a-option
          value="en"
          class="block cursor-pointer rounded-md px-3 py-2 text-sm text-stone-700 hover:bg-primary-50 [&[selected]]:bg-primary-50 [&[selected]]:font-medium [&[selected]]:text-primary-900"
        >
          English
        </a-option>
        <a-option
          value="de"
          class="block cursor-pointer rounded-md px-3 py-2 text-sm text-stone-700 hover:bg-primary-50 [&[selected]]:bg-primary-50 [&[selected]]:font-medium [&[selected]]:text-primary-900"
        >
          Deutsch
        </a-option>
        <a-option
          value="fr"
          class="block cursor-pointer rounded-md px-3 py-2 text-sm text-stone-700 hover:bg-primary-50 [&[selected]]:bg-primary-50 [&[selected]]:font-medium [&[selected]]:text-primary-900"
        >
          Français
        </a-option>
        <a-option
          value="ja"
          class="block cursor-pointer rounded-md px-3 py-2 text-sm text-stone-700 hover:bg-primary-50 [&[selected]]:bg-primary-50 [&[selected]]:font-medium [&[selected]]:text-primary-900"
        >
          日本語
        </a-option>
      </div>
    </a-select>
  </label>
</form>
