<!-- requires: @atrium-ui/elements/track -->
<!-- Built with Atrium UI — https://atrium-ui.dev/ -->
<!-- Horizontal snap carousel like the carousel component: a `snap` track of
  `flex-none` slides with prev/next buttons calling `moveBy(±1)`.
  `scroll` / `change` events are available for progress indicators.
  The wrapper clips horizontally so the visible track never scrolls the page. -->
<div class="max-w-2xl overflow-x-clip">
  <div class="group relative">
    <a-track
      id="kit-carousel"
      snap
      class="flex w-full gap-4 overflow-visible rounded-2xl"
    >
      <div class="w-60 flex-none cursor-pointer">
        <span
          class="flex aspect-[4/3] items-center justify-center rounded-xl bg-stone-200 text-stone-400"
          role="img"
          aria-label="Scratchpad document"
        >
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M6 2h9l5 5v15H6V2Z M14 2v6h6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="M9 13h7M9 17h7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span
          class="mt-2 block text-[11px] font-medium uppercase tracking-wide text-stone-500"
          >Today</span
        >
        <span class="block font-display text-[15px] font-semibold italic text-primary-900"
          >Scratchpad</span
        >
      </div>
      <div class="w-60 flex-none cursor-pointer">
        <span
          class="flex aspect-[4/3] items-center justify-center rounded-xl bg-stone-200 text-stone-400"
          role="img"
          aria-label="Things to do document"
        >
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M6 2h9l5 5v15H6V2Z M14 2v6h6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="M9 13h7M9 17h7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span
          class="mt-2 block text-[11px] font-medium uppercase tracking-wide text-stone-500"
          >2 days ago</span
        >
        <span class="block font-display text-[15px] font-semibold italic text-primary-900"
          >Things to do</span
        >
      </div>
      <div class="w-60 flex-none cursor-pointer">
        <span
          class="flex aspect-[4/3] items-center justify-center rounded-xl bg-stone-200 text-stone-400"
          role="img"
          aria-label="Piano document"
        >
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M6 2h9l5 5v15H6V2Z M14 2v6h6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="M9 13h7M9 17h7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span
          class="mt-2 block text-[11px] font-medium uppercase tracking-wide text-stone-500"
          >4 days ago</span
        >
        <span class="block font-display text-[15px] font-semibold italic text-primary-900"
          >Piano</span
        >
      </div>
      <div class="w-60 flex-none cursor-pointer">
        <span
          class="flex aspect-[4/3] items-center justify-center rounded-xl bg-stone-200 text-stone-400"
          role="img"
          aria-label="Blog posts document"
        >
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M6 2h9l5 5v15H6V2Z M14 2v6h6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="M9 13h7M9 17h7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span
          class="mt-2 block text-[11px] font-medium uppercase tracking-wide text-stone-500"
          >29/08/2026</span
        >
        <span class="block font-display text-[15px] font-semibold italic text-primary-900"
          >Blog Posts</span
        >
      </div>
    </a-track>

    <button
      type="button"
      aria-label="Previous slide"
      onclick="document.getElementById('kit-carousel').moveBy(-1)"
      class="absolute top-1/3 left-2 z-10 flex size-9 cursor-pointer items-center justify-center whitespace-nowrap rounded-full border border-stone-200 bg-white/95 text-stone-700 opacity-0 shadow-sm transition duration-150 ease-out group-hover:opacity-100 hover:bg-white hover:text-stone-900 hover:shadow-md focus-visible:opacity-100 focus-visible:ring-2 focus-visible:ring-stone-300 focus-visible:outline-none active:scale-90 active:bg-stone-100 active:shadow-sm"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M15 6l-6 6 6 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <button
      type="button"
      aria-label="Next slide"
      onclick="document.getElementById('kit-carousel').moveBy(1)"
      class="absolute top-1/3 right-2 z-10 flex size-9 cursor-pointer items-center justify-center whitespace-nowrap rounded-full border border-stone-200 bg-white/95 text-stone-700 opacity-0 shadow-sm transition duration-150 ease-out group-hover:opacity-100 hover:bg-white hover:text-stone-900 hover:shadow-md focus-visible:opacity-100 focus-visible:ring-2 focus-visible:ring-stone-300 focus-visible:outline-none active:scale-90 active:bg-stone-100 active:shadow-sm"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M9 6l6 6-6 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
  <p class="mt-3 text-xs text-stone-500">
    Never autoplay content users must read; every slide stays reachable by keyboard (the
    track is focusable, buttons are real buttons).
  </p>
</div>
