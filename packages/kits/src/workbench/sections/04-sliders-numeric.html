<!-- requires: none (vanilla JS — style + script included below) -->
<div
  class="grid w-full max-w-xl gap-1 rounded-lg border border-white/10 bg-[#232428] p-4 text-[12px]"
>
  <p class="mb-2 text-[11px] font-semibold tracking-wide text-zinc-500 uppercase">
    Drag-number fields
  </p>
  <div
    data-drag-number
    data-dn-track
    data-min="0"
    data-max="5"
    data-step="0.01"
    data-precision="2"
    data-value="2.95"
    style="--dn-fill: 0.59"
    class="flex items-center gap-2 rounded px-2 py-1"
  >
    <span class="min-w-0 flex-1 truncate font-medium text-white">Ambient light</span>
    <input
      type="number"
      value="2.95"
      aria-label="Ambient light"
      class="w-14 shrink-0 bg-transparent text-right font-mono text-[11px] text-white focus:outline-none"

  </div>
  <div
    data-drag-number
    data-dn-track
    data-min="0"
    data-max="100"
    data-step="0.1"
    data-precision="2"
    data-value="69.7"
    style="--dn-fill: 0.697"
    class="flex items-center gap-2 rounded px-2 py-1"
  >
    <span class="min-w-0 flex-1 truncate font-medium text-white">Sun azimuth °</span>
    <input
      type="number"
      value="69.70"
      aria-label="Sun azimuth"
      class="w-14 shrink-0 bg-transparent text-right font-mono text-[11px] text-white focus:outline-none"
    >
  </div>
  <div
    data-drag-number
    data-dn-track
    data-min="0"
    data-max="90"
    data-step="0.1"
    data-precision="2"
    data-value="27.4"
    style="--dn-fill: 0.304"
    class="flex items-center gap-2 rounded px-2 py-1"
  >
    <span class="min-w-0 flex-1 truncate font-medium text-white">Sun elevation °</span>
    <input
      type="number"
      value="27.40"
      aria-label="Sun elevation"
      class="w-14 shrink-0 bg-transparent text-right font-mono text-[11px] text-white focus:outline-none"
    >
  </div>
  <div
    data-drag-number
    data-dn-track
    data-min="0"
    data-max="5"
    data-step="0.01"
    data-precision="2"
    data-value="3.55"
    style="--dn-fill: 0.71"
    class="flex items-center gap-2 rounded px-2 py-1"
  >
    <span class="min-w-0 flex-1 truncate font-medium text-white">Sun intensity</span>
    <input
      type="number"
      value="3.55"
      aria-label="Sun intensity"
      class="w-14 shrink-0 bg-transparent text-right font-mono text-[11px] text-white focus:outline-none"
    >
  </div>
  <p class="mt-2 text-[11px] text-zinc-500">
    Drag horizontally to scrub · scroll to nudge (⇧ ×10) · double-click resets ·
    click the value to type. Real inputs, so keyboard and form submit keep working.
  </p>
  <style>
    [data-drag-number] {
      cursor: ew-resize;
      touch-action: pan-y;
      background: linear-gradient(
        to right,
        var(--color-primary-600) 0%,
        var(--color-primary-600) calc(var(--dn-fill, 0) * 100%),
        rgb(255 255 255 / 0.08) calc(var(--dn-fill, 0) * 100%),
        rgb(255 255 255 / 0.08) 100%
      );
    }
    [data-drag-number] input[type="number"] { cursor: text; }
    [data-drag-number] input[type="number"]::-webkit-outer-spin-button,
    [data-drag-number] input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    [data-drag-number] input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    [data-drag-number][data-dragging] { user-select: none; }
    [data-drag-number]:focus-within {
      outline: 1px solid var(--color-primary-400);
      outline-offset: 0;
    }
  </style>
  <script>
    (() => {
      const PX_FOR_FULL_RANGE = 200;
      const setup = (root) => {
        if (root.dataset.dnInit) return;
        root.dataset.dnInit = "true";
        const input = root.querySelector('input[type="number"]');
        if (!input) return;
        const min = Number(root.dataset.min ?? input.min ?? 0);
        const max = Number(root.dataset.max ?? input.max ?? 100);
        const step = Number(root.dataset.step ?? input.step ?? 1);
        const precision = Number(root.dataset.precision ?? 2);
        const def = root.hasAttribute("data-value") ? Number(root.dataset.value) : null;
        const clamp = (v) => Math.min(max, Math.max(min, v));
        const paint = (v) => {
          const t = max === min ? 0 : (clamp(v) - min) / (max - min);
          root.style.setProperty("--dn-fill", String(t));
        };
        const commit = (v, fire = true) => {
          const c = clamp(v);
          input.value = c.toFixed(precision);
          paint(c);
          if (fire) {
            input.dispatchEvent(new Event("input", { bubbles: true }));
            input.dispatchEvent(new Event("change", { bubbles: true }));
          }
        };
        const start = Number(input.value);
        commit(Number.isNaN(start) ? (def ?? min) : start, false);
        let drag = null;
        root.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          drag = { x: e.clientX, v: Number(input.value), moved: false, id: e.pointerId };
        });
        root.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const dx = e.clientX - drag.x;
          if (!drag.moved && Math.abs(dx) < 3) return;
          if (!drag.moved) input.blur();
          drag.moved = true;
          try { root.setPointerCapture(e.pointerId); } catch {}
          window.getSelection()?.removeAllRanges();
          root.dataset.dragging = "true";
          commit(drag.v + (dx / PX_FOR_FULL_RANGE) * (max - min));
        });
        const end = () => {
          if (!drag) return;
          drag = null;
          delete root.dataset.dragging;
        };
        root.addEventListener("pointerup", end);
        root.addEventListener("pointercancel", end);
        root.addEventListener("dblclick", () => { if (def !== null && !Number.isNaN(def)) commit(def); });
        root.addEventListener("wheel", (e) => {
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          commit(Number(input.value) + dir * step * (e.shiftKey ? 10 : 1));
        }, { passive: false });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { commit(Number(input.value)); input.blur(); }
          if (e.key === "Escape") { commit(Number(input.value), false); input.blur(); }
        });
        input.addEventListener("input", () => {
          const n = Number(input.value);
          if (!Number.isNaN(n)) paint(n);
        });
        input.addEventListener("change", () => {
          const n = Number(input.value);
          commit(Number.isNaN(n) ? (def ?? min) : n, false);
        });
      };
      document.querySelectorAll("[data-drag-number]").forEach(setup);
    })();
  </script>
</div>
