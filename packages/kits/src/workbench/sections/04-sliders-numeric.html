<!-- requires: none (vanilla JS — style + script included below) -->
<div class="grid w-full max-w-xl gap-1 rounded-lg border border-white/10 bg-[#232428] p-4 text-[12px]">
  <p class="mb-2 text-[11px] font-semibold tracking-wide text-zinc-500 uppercase">Drag-number fields — label pill + value field, no slider track</p>
  <div class="flex items-center gap-1" data-drag-number data-min="0" data-max="2" data-step="0.01" data-precision="2" data-value="1">
    <span class="w-24 shrink-0 truncate rounded bg-primary-500/80 px-1.5 py-1 font-medium text-white">Exposure</span>
    <span class="flex min-w-0 flex-1 items-center gap-1 rounded border border-transparent bg-white/5 px-1.5 py-1 focus-within:border-primary-400">
      <input type="number" value="1.00" aria-label="Exposure" class="w-full min-w-0 bg-transparent text-right font-mono text-[11px] text-zinc-200 focus:outline-none" />
    </span>
  </div>
  <div class="flex items-center gap-1" data-drag-number data-min="0" data-max="1" data-step="0.01" data-precision="2" data-value="0.38">
    <span class="w-24 shrink-0 truncate rounded bg-primary-500/80 px-1.5 py-1 font-medium text-white">Roughness</span>
    <span class="flex min-w-0 flex-1 items-center gap-1 rounded border border-transparent bg-white/5 px-1.5 py-1 focus-within:border-primary-400">
      <input type="number" value="0.38" aria-label="Roughness" class="w-full min-w-0 bg-transparent text-right font-mono text-[11px] text-zinc-200 focus:outline-none" />
    </span>
  </div>
  <div class="flex items-center gap-1" data-drag-number data-min="0" data-max="1" data-step="0.01" data-precision="2" data-value="0.3">
    <span class="w-24 shrink-0 truncate rounded bg-primary-500/80 px-1.5 py-1 font-medium text-white">Metallic</span>
    <span class="flex min-w-0 flex-1 items-center gap-1 rounded border border-transparent bg-white/5 px-1.5 py-1 focus-within:border-primary-400">
      <input type="number" value="0.30" aria-label="Metallic" class="w-full min-w-0 bg-transparent text-right font-mono text-[11px] text-zinc-200 focus:outline-none" />
    </span>
  </div>
  <div class="flex items-center gap-1" data-drag-number data-min="-10" data-max="10" data-step="0.01" data-precision="4" data-value="-1.4093">
    <span class="w-24 shrink-0 truncate rounded bg-primary-500/80 px-1.5 py-1 font-medium text-white">Location X</span>
    <span class="flex min-w-0 flex-1 items-center gap-1 rounded border border-transparent bg-white/5 px-1.5 py-1 focus-within:border-primary-400">
      <input type="number" value="-1.4093" aria-label="Location X" class="w-full min-w-0 bg-transparent text-right font-mono text-[11px] text-zinc-200 focus:outline-none" />
      <span class="font-mono text-[11px] text-zinc-500">m</span>
    </span>
  </div>
  <p class="mt-2 text-[11px] text-zinc-500">Drag a row horizontally to scrub · scroll to nudge (⇧ ×10) · double-click resets · click the value to type. Real inputs, so keyboard and form submit keep working.</p>
  <style>
    [data-drag-number] { cursor: ew-resize; touch-action: pan-y; }
    [data-drag-number] input[type="number"] { cursor: text; }
    [data-drag-number] input[type="number"]::-webkit-outer-spin-button,
    [data-drag-number] input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    [data-drag-number] input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    [data-drag-number][data-dragging] { user-select: none; }
    [data-drag-number][data-dragging] > span:first-child { background: var(--color-primary-500); }
  </style>
  <script>
    (() => {
      const PX_FOR_FULL_RANGE = 200;
      const setup = (root) => {
        if (root.dataset.dnInit) return;
        root.dataset.dnInit = "true";
        const input = root.querySelector('input[type="number"]');
        if (!input) return;
        const min = Number(root.dataset.min ?? input.min ?? 0);
        const max = Number(root.dataset.max ?? input.max ?? 100);
        const step = Number(root.dataset.step ?? input.step ?? 1);
        const precision = Number(root.dataset.precision ?? 2);
        const def = root.hasAttribute("data-value") ? Number(root.dataset.value) : null;
        const clamp = (v) => Math.min(max, Math.max(min, v));
        const fmt = (v) => clamp(v).toFixed(precision);
        const commit = (v, fire = true) => {
          input.value = fmt(v);
          if (fire) {
            input.dispatchEvent(new Event("input", { bubbles: true }));
            input.dispatchEvent(new Event("change", { bubbles: true }));
          }
        };
        const start = Number(input.value);
        input.value = fmt(Number.isNaN(start) ? (def ?? min) : start);
        let drag = null;
        root.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          drag = { x: e.clientX, v: Number(input.value), moved: false, id: e.pointerId };
        });
        root.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const dx = e.clientX - drag.x;
          if (!drag.moved && Math.abs(dx) < 3) return;
          drag.moved = true;
          try { root.setPointerCapture(e.pointerId); } catch {}
          window.getSelection()?.removeAllRanges();
          root.dataset.dragging = "true";
          commit(drag.v + (dx / PX_FOR_FULL_RANGE) * (max - min));
        });
        const end = () => {
          if (!drag) return;
          drag = null;
          delete root.dataset.dragging;
        };
        root.addEventListener("pointerup", end);
        root.addEventListener("pointercancel", end);
        root.addEventListener("dblclick", () => { if (def !== null && !Number.isNaN(def)) commit(def); });
        root.addEventListener("wheel", (e) => {
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          commit(Number(input.value) + dir * step * (e.shiftKey ? 10 : 1));
        }, { passive: false });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { commit(Number(input.value)); input.blur(); }
          if (e.key === "Escape") { input.value = fmt(Number(input.value)); input.blur(); }
        });
        input.addEventListener("change", () => {
          const n = Number(input.value);
          input.value = fmt(Number.isNaN(n) ? (def ?? min) : n);
        });
      };
      document.querySelectorAll("[data-drag-number]").forEach(setup);
    })();
  </script>
</div>
