<!-- requires: @atrium-ui/elements/select -->
<!-- Built with Atrium UI — https://atrium-ui.dev/ -->
<!-- Trigger label is kit-owned: sync it from the `change` event
     (`event.detail.selected`). The element does not rewrite the slot. -->
<div
  class="w-full max-w-xl rounded-lg border border-white/10 bg-[#232428] p-3 text-[12px]"
>
  <p
    class="mb-2 text-[11px] font-semibold tracking-wide text-zinc-500 uppercase"
  >
    Export — fixed enums, not free text
  </p>
  <div class="grid gap-2">
    <label class="flex items-center gap-2">
      <span class="w-24 shrink-0 font-medium text-zinc-300">Format</span>
      <a-select
        name="format"
        value="gltf"
        class="relative min-w-0 flex-1 [&[opened]_.select-chevron]:rotate-180"
        onchange="const l=this.querySelector('[data-kit-select-label]');const o=event.detail.selected;if(l&&o)l.textContent=o.textContent.trim()"
      >
        <button
          slot="trigger"
          type="button"
          aria-haspopup="listbox"
          class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-md border border-white/10 bg-[#1c1d20] px-2 py-1.5 text-left font-mono text-[11px] text-zinc-200 transition-colors hover:border-white/25 focus:border-primary-400 focus:outline-none"
        >
          <span data-kit-select-label class="min-w-0 flex-1 truncate"
            >glTF 2.0</span
          >
          <svg
            aria-hidden="true"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            class="select-chevron size-3.5 flex-none text-zinc-500 transition-transform duration-150"
          >
            <path
              d="m5 7.5 5 5 5-5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div
          class="mt-1 rounded-md border border-white/10 bg-[#1c1d20] p-0.5 shadow-[0_8px_24px_-4px_rgb(0_0_0/0.5)]"
        >
          <a-option
            value="gltf"
            class="block cursor-pointer rounded px-2 py-1 font-mono text-[11px] text-zinc-300 hover:bg-white/5 [&[selected]]:bg-primary-500/20 [&[selected]]:text-primary-200"
            >glTF 2.0</a-option
          >
          <a-option
            value="fbx"
            class="block cursor-pointer rounded px-2 py-1 font-mono text-[11px] text-zinc-300 hover:bg-white/5 [&[selected]]:bg-primary-500/20 [&[selected]]:text-primary-200"
            >FBX</a-option
          >
          <a-option
            value="usd"
            class="block cursor-pointer rounded px-2 py-1 font-mono text-[11px] text-zinc-300 hover:bg-white/5 [&[selected]]:bg-primary-500/20 [&[selected]]:text-primary-200"
            >USDZ</a-option
          >
          <a-option
            value="obj"
            class="block cursor-pointer rounded px-2 py-1 font-mono text-[11px] text-zinc-300 hover:bg-white/5 [&[selected]]:bg-primary-500/20 [&[selected]]:text-primary-200"
            >OBJ</a-option
          >
        </div>
      </a-select>
    </label>

    <label class="flex items-center gap-2">
      <span class="w-24 shrink-0 font-medium text-zinc-300">Shading</span>
      <a-select
        name="shading"
        value="pbr"
        class="relative min-w-0 flex-1 [&[opened]_.select-chevron]:rotate-180"
        onchange="const l=this.querySelector('[data-kit-select-label]');const o=event.detail.selected;if(l&&o)l.textContent=o.textContent.trim()"
      >
        <button
          slot="trigger"
          type="button"
          aria-haspopup="listbox"
          class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-md border border-white/10 bg-[#1c1d20] px-2 py-1.5 text-left font-mono text-[11px] text-zinc-200 transition-colors hover:border-white/25 focus:border-primary-400 focus:outline-none"
        >
          <span data-kit-select-label class="min-w-0 flex-1 truncate"
            >PBR Metallic</span
          >
          <svg
            aria-hidden="true"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            class="select-chevron size-3.5 flex-none text-zinc-500 transition-transform duration-150"
          >
            <path
              d="m5 7.5 5 5 5-5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div
          class="mt-1 rounded-md border border-white/10 bg-[#1c1d20] p-0.5 shadow-[0_8px_24px_-4px_rgb(0_0_0/0.5)]"
        >
          <a-option
            value="pbr"
            class="block cursor-pointer rounded px-2 py-1 font-mono text-[11px] text-zinc-300 hover:bg-white/5 [&[selected]]:bg-primary-500/20 [&[selected]]:text-primary-200"
            >PBR Metallic</a-option
          >
          <a-option
            value="unlit"
            class="block cursor-pointer rounded px-2 py-1 font-mono text-[11px] text-zinc-300 hover:bg-white/5 [&[selected]]:bg-primary-500/20 [&[selected]]:text-primary-200"
            >Unlit</a-option
          >
          <a-option
            value="toon"
            class="block cursor-pointer rounded px-2 py-1 font-mono text-[11px] text-zinc-300 hover:bg-white/5 [&[selected]]:bg-primary-500/20 [&[selected]]:text-primary-200"
            >Toon</a-option
          >
        </div>
      </a-select>
    </label>
  </div>
</div>
