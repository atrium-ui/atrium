<!-- requires: @atrium-ui/elements/toggle -->
<!-- Built with Atrium UI — https://atrium-ui.dev/ -->
<div class="w-full max-w-xl rounded-lg border border-white/10 bg-[#232428] text-[12px]">
  <p class="border-b border-white/10 px-3 py-2 text-[11px] font-semibold tracking-wide text-zinc-500 uppercase">Viewport — one switch, one immediate effect</p>
  <div class="divide-y divide-white/5">
    <label class="flex cursor-pointer items-center gap-3 px-3 py-2">
      <span class="text-zinc-200"><strong class="font-medium">Wind</strong><span class="block text-[11px] text-zinc-500">Vertex animation in preview.</span></span>
      <a-toggle name="wind" value="true" class="ml-auto inline-flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full bg-white/10 px-0.5 transition-colors [&[value='true']]:bg-primary-500">
        <span slot="true" class="block size-4 translate-x-4 rounded-full bg-white shadow transition-transform"></span>
        <span slot="false" class="block size-4 rounded-full bg-white shadow transition-transform"></span>
      </a-toggle>
    </label>
    <label class="flex cursor-pointer items-center gap-3 px-3 py-2">
      <span class="text-zinc-200"><strong class="font-medium">Bloom</strong><span class="block text-[11px] text-zinc-500">HDR glow pass.</span></span>
      <a-toggle name="bloom" value="true" class="ml-auto inline-flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full bg-white/10 px-0.5 transition-colors [&[value='true']]:bg-primary-500">
        <span slot="true" class="block size-4 translate-x-4 rounded-full bg-white shadow transition-transform"></span>
        <span slot="false" class="block size-4 rounded-full bg-white shadow transition-transform"></span>
      </a-toggle>
    </label>
    <label class="flex cursor-pointer items-center gap-3 px-3 py-2">
      <span class="text-zinc-200"><strong class="font-medium">Ground</strong><span class="block text-[11px] text-zinc-500">Shadow catcher plane.</span></span>
      <a-toggle name="ground" value="false" class="ml-auto inline-flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full bg-white/10 px-0.5 transition-colors [&[value='true']]:bg-primary-500">
        <span slot="true" class="block size-4 translate-x-4 rounded-full bg-white shadow transition-transform"></span>
        <span slot="false" class="block size-4 rounded-full bg-white shadow transition-transform"></span>
      </a-toggle>
    </label>
    <label class="flex cursor-pointer items-center gap-3 px-3 py-2">
      <span class="text-zinc-200"><strong class="font-medium">Export .cheetmesh on save</strong><span class="block text-[11px] text-zinc-500">Needs Apply/Confirm — prefer a checkbox.</span></span>
      <a-toggle name="autosave" value="false" class="ml-auto inline-flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full bg-white/10 px-0.5 transition-colors [&[value='true']]:bg-primary-500">
        <span slot="true" class="block size-4 translate-x-4 rounded-full bg-white shadow transition-transform"></span>
        <span slot="false" class="block size-4 rounded-full bg-white shadow transition-transform"></span>
      </a-toggle>
    </label>
  </div>
</div>
