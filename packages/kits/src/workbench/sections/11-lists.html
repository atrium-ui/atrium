  <a-list class="block max-h-64 overflow-y-auto p-1" aria-label="Project assets">

    </a-list-item>
    <a-list-item
      class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-zinc-300 transition-colors hover:bg-white/5"
    >
      <span
        aria-hidden="true"
        class="flex size-6 shrink-0 items-center justify-center rounded bg-white/5 text-[10px] font-bold text-zinc-400"

      <span class="min-w-0 flex-1 truncate font-mono text-[11px]">cargo-crate</span>
      <span class="font-mono text-[10px] text-zinc-500">184 KiB</span>
    </a-list-item>
    <a-list-item

      <span
        aria-hidden="true"
        class="flex size-6 shrink-0 items-center justify-center rounded bg-white/5 text-[10px] font-bold text-zinc-400"

      <span class="min-w-0 flex-1 truncate font-mono text-[11px]">chess-queen</span>
