<div class="grid w-full max-w-xl gap-1.5 text-[12px] sm:grid-cols-2">
  <a
    href="#"
    aria-label="Open animated-hatch, modified today"
    class="group flex items-center gap-2.5 rounded-lg border border-white/10 bg-[#232428] p-2.5 no-underline transition-colors hover:border-primary-400/50"

    <span

      aria-label="animated hatch preview"

    <span class="min-w-0">
      <span class="block font-mono text-[11px] text-zinc-100">animated-hatch</span>

  <a
    href="#"
    aria-label="Open chess-rook, modified 2 days ago"
    class="group flex items-center gap-2.5 rounded-lg border border-white/10 bg-[#232428] p-2.5 no-underline transition-colors hover:border-primary-400/50"
  >
    <span
      class="flex size-11 flex-none items-center justify-center rounded-md bg-gradient-to-br from-zinc-500 to-zinc-700 text-lg text-zinc-300"
      role="img"
      aria-label="chess rook preview"
      aria-hidden="true"
      >♜</span

    <span class="min-w-0">
      <span class="block font-mono text-[11px] text-zinc-100">chess-rook</span>
      <span class="mt-0.5 block text-[11px] text-zinc-500">2 days ago</span>
    </span>
