<!-- requires: @atrium-ui/elements/list -->
<!-- Built with Atrium UI — https://atrium-ui.dev/ -->
<div
  class="@container w-full max-w-xl rounded-lg border border-white/10 bg-[#232428] p-3 text-[12px]"
>
  <div class="mb-2 flex items-center gap-2 px-1">
    <span class="text-[11px] font-semibold tracking-wide text-zinc-500 uppercase"
      >Assets</span
    >
    <span class="ml-auto font-mono text-[11px] text-zinc-500">36/36</span>
  </div>
  <a-list
    class="grid auto-rows-min grid-cols-2 gap-1.5 @2xs:grid-cols-3 @sm:grid-cols-4 @lg:grid-cols-5 @2xl:grid-cols-6"
    aria-label="Asset thumbnails"
  >
    <a-list-item
      selected
      class="cursor-pointer overflow-hidden rounded-md border border-primary-400 bg-[#1c1d20]"
    >
      <span
        class="flex aspect-square items-center justify-center bg-gradient-to-br from-amber-500/40 to-amber-900/40 text-xl"
        role="img"
        aria-label="animated hatch preview"
        >▣</span
      >
      <span class="block truncate px-1.5 py-1 font-mono text-[10px] text-zinc-200"
        >animated-hatch…</span
      >
    </a-list-item>
    <a-list-item
      class="cursor-pointer overflow-hidden rounded-md border border-white/10 bg-[#1c1d20] transition-colors hover:border-white/25"
    >
      <span
        class="flex aspect-square items-center justify-center bg-gradient-to-br from-orange-900/60 to-stone-800 text-xl text-orange-200/60"
        role="img"
        aria-label="cargo crate preview"
        >▦</span
      >
      <span class="block truncate px-1.5 py-1 font-mono text-[10px] text-zinc-400"
        >cargo-crate…</span
      >
    </a-list-item>
    <a-list-item
      class="cursor-pointer overflow-hidden rounded-md border border-white/10 bg-[#1c1d20] transition-colors hover:border-white/25"
    >
      <span
        class="flex aspect-square items-center justify-center bg-gradient-to-br from-zinc-600 to-zinc-800 text-xl text-zinc-400"
        role="img"
        aria-label="chess bishop preview"
        >♝</span
      >
      <span class="block truncate px-1.5 py-1 font-mono text-[10px] text-zinc-400"
        >chess-bishop…</span
      >
    </a-list-item>
    <a-list-item
      class="cursor-pointer overflow-hidden rounded-md border border-white/10 bg-[#1c1d20] transition-colors hover:border-white/25"
    >
      <span
        class="flex aspect-square items-center justify-center bg-gradient-to-br from-zinc-500 to-zinc-700 text-xl text-zinc-300"
        role="img"
        aria-label="chess frame preview"
        >⬢</span
      >
      <span class="block truncate px-1.5 py-1 font-mono text-[10px] text-zinc-400"
        >chess-frame…</span
      >
    </a-list-item>
  </a-list>
</div>
